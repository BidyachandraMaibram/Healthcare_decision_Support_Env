version = 1
requires-python = ">=3.10"

[[package]]
name = "healthcareenv"
version = "1.0.0"
source = { editable = "." }
dependencies = [
  { name = "fastapi" },
  { name = "uvicorn", extras = ["standard"] },
  { name = "pydantic" },
  { name = "openenv-core" },
]

[package.metadata]
requires-dist = [
  { name = "fastapi", specifier = "==0.115.0" },
  { name = "uvicorn", extras = ["standard"], specifier = "==0.30.6" },
  { name = "pydantic", specifier = "==2.7.1" },
  { name = "openenv-core", specifier = ">=0.2.0" },
]

[[package]]
name = "fastapi"
version = "0.115.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "uvicorn"
version = "0.30.6"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pydantic"
version = "2.7.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "openenv-core"
version = "0.2.2"
source = { registry = "https://pypi.org/simple" }
